<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Result</title>
</head>
<body>

    <h1>Waste Information</h1>

    {% if data %}

        <h2>{{ item }}</h2>

        <p><b>Category:</b> {{ data.category }}</p>

        <p><b>Disposal:</b> {{ data.disposal }}</p>

        <p><b>Impact:</b> {{ data.impact }}</p>

        <p><b>Alternative:</b> {{ data.alternative }}</p>

    {% else %}

        <h2>Item Not Found</h2>

    {% endif %}

    <br>

    <a href="/">Back</a>

</body>
</html>
